# 这是完整 nginx 主配置文件，可直接覆盖 /etc/nginx/nginx.conf。
# 如果要放到 /etc/nginx/conf.d/*.conf，请只保留 http {} 里面的 server {} 配置。
user nginx;
# 核心优化1：自动匹配CPU核心数，充分利用服务器性能
worker_processes auto;
# 优化错误日志级别（减少无用IO，提升性能）
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;
# 优化2：打开文件描述符上限（解决并发连接限制）
worker_rlimit_nofile 65535;

events {
    # 核心优化3：使用高效IO模型（Linux必开）
    use epoll;
    # 优化4：提升单进程最大连接数（从1024→65535）
    worker_connections 65535;
    # 优化5：允许一次接收多个连接
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 核心优化6：开启高效文件传输（静态页面提速50%+）
    sendfile on;
    # 优化7：减少网络包次数，提升传输效率
    tcp_nopush on;
    tcp_nodelay on;
    # 优化8：长连接保持时间（避免频繁重连）
    keepalive_timeout 65;
    # 优化9：客户端请求头缓冲区（解决大请求卡顿）
    client_header_buffer_size 4k;
    large_client_header_buffers 4 8k;
    # 优化10：开启gzip压缩（静态资源体积缩小60%+，访问飞起来）
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/xml+rss image/svg+xml;
    gzip_min_length 1k;

    # HTTP强制跳转HTTPS
    server {
        listen 80 default_server;
        server_name code.dxb888.top;
        return 301 https://$host$request_uri;
    }

    # HTTPS核心服务
    server {
        listen 443 ssl default_server;
        server_name code.dxb888.top;

        ssl_certificate /root/ai-code/ssl/code.dxb888.top.pem;
        ssl_certificate_key /root/ai-code/ssl/code.dxb888.top.key;

        # SSL性能优化
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        root /root/ai-code/dist;
        index index.html;

        # AI 生成应用部署目录：
        # 后端会将应用复制到 /root/ai-code/tmp/code_deploy/{deployKey}
        # 访问格式为 https://code.dxb888.top/{deployKey}/
        location ~ "^/([A-Za-z0-9]{6})$" {
            return 301 /$1/;
        }

        location ~ "^/([A-Za-z0-9]{6})/(.*)$" {
            root /root/ai-code/tmp/code_deploy;
            index index.html;
            try_files /$1/$2 /$1/$2/ /$1/index.html =404;
        }

        # 静态资源缓存优化（浏览器缓存，二次访问秒开）
        location ~* \.(html|css|js|png|jpg|jpeg|gif|ico|svg)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        # 接口代理优化
        location /api/ {
            proxy_pass http://127.0.0.1:8123/api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # 代理超时优化（避免接口等待卡死）
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
}
