server {
    listen 80;
    server_name code.dxb888.top;
    # 80端口自动跳转HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name code.dxb888.top;

    # SSL 证书配置（你的路径）
    ssl_certificate /root/ai-code/ssl/code.dxb888.top.pem;
    ssl_certificate_key /root/ai-code/ssl/code.dxb888.top.key;

    # SSL 安全优化
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;

    # 前端目录
    root /root/ai-code/dist;
    index index.html;

    client_max_body_size 20m;

    # SPA 前端
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端接口（流式SSE兼容）
    location /api/ {
        proxy_pass http://127.0.0.1:8123/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 部署项目访问
    location ~ ^/deploy/([^/]+)/?$ {
        alias /root/ai-code/tmp/code_deploy/$1/;
        index index.html;
    }

    location ~ ^/deploy/([^/]+)/(.*)$ {
        alias /root/ai-code/tmp/code_deploy/$1/$2;
        try_files $request_filename $request_filename/ /deploy/$1/index.html;
    }
}