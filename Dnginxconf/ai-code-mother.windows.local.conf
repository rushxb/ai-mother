# Windows 本地 nginx 主配置，可直接覆盖 nginx/conf/nginx.conf。
# 与服务端版 ai-code-mother.server.conf 保持同一套路由：
#   - http://localhost:91/          主前端
#   - http://localhost:91/{6位key}/  已部署的 AI 生成应用
#   - http://localhost:91/api/      代理到本地 Spring Boot 后端

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    client_max_body_size     50m;
    client_body_buffer_size  10m;
    client_header_timeout    1m;
    client_body_timeout      1m;

    gzip on;
    gzip_min_length  1k;
    gzip_buffers     4 16k;
    gzip_comp_level  4;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        image/svg+xml;
    gzip_vary on;

    server {
        # 你当前本地 8088 已被 hudong_geoms_web 占用，所以这里使用 91。
        # 请同步修改：
        #   1. 后端环境变量 CODE_DEPLOY_HOST
        #   2. 前端环境变量 VITE_DEPLOY_DOMAIN
        listen       91;
        server_name  localhost;
        charset      utf-8;
        charset_types text/css application/javascript text/plain text/xml application/json;

        # 主前端构建产物目录：先在 rush-ai-code-mother-frontend 下执行 pnpm build / npm run build。
        root   "D:/java项目/ai-code-mother/rush-ai-code-mother-frontend/dist";
        index  index.html index.htm;

        # 主项目 Vite 静态资源目录。必须使用 ^~，避免 /assets/... 被 6 位 deployKey 正则误匹配。
        location ^~ /assets/ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            try_files $uri =404;
        }

        # AI 生成应用部署目录：
        # 后端默认写入 D:/java项目/ai-code-mother/tmp/code_deploy/{deployKey}
        # 访问格式为 http://localhost:91/{deployKey}/
        location ~ "^/([A-Za-z0-9]{6})$" {
            return 301 /$1/;
        }

        location ~ "^/([A-Za-z0-9]{6})/(.*)$" {
            root "D:/java项目/ai-code-mother/tmp/code_deploy";
            index index.html;
            try_files /$1/$2 /$1/$2/ /$1/index.html =404;
        }

        # 首页入口不缓存，避免 index.html 引用已被删除的旧 assets 文件。
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files /index.html =404;
        }

        # Vite 构建产物带 hash，可以短期缓存。
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Spring Boot 本地后端：
        # application.yml 中 server.port=8123，context-path=/api。
        location /api/ {
            proxy_pass http://127.0.0.1:8123/api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
}
