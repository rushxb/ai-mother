spring:
  main:
    web-application-type: none

app:
  background-jobs:
    enabled: false
  generation-task-queue:
    transport: local
  generation-event-stream:
    transport: local
  template-pre-warm:
    enabled: false
  generation-benchmark:
    worker:
      enabled: true
    browser-grading:
      enabled: ${GENERATION_BENCHMARK_BROWSER_GRADING_ENABLED:true}
    backend-grading:
      enabled: ${GENERATION_BENCHMARK_BACKEND_GRADING_ENABLED:true}
