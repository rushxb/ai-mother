spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/rush_ai_code_mother?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
  session:
    timeout: ${SESSION_TIMEOUT:8h}

server:
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
  servlet:
    session:
      cookie:
        secure: true
        max-age: ${SESSION_COOKIE_MAX_AGE:8h}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    allow-credentials: true
  template-pre-warm:
    enabled: ${TEMPLATE_PRE_WARM_ENABLED:false}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

knife4j:
  enable: false

management:
  endpoint:
    health:
      show-details: never

code:
  deploy-host: ${CODE_DEPLOY_HOST:http://localhost:91}
