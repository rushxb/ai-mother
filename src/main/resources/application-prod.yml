spring:
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${FLYWAY_BASELINE_VERSION:20260716.5}
    baseline-description: production-schema-before-flyway
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD}
  session:
    timeout: ${SESSION_TIMEOUT:8h}

logging:
  level:
    com.rush.rushaicodemother.mapper.AiModelMapper: OFF

server:
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
  servlet:
    session:
      cookie:
        secure: true
        max-age: ${SESSION_COOKIE_MAX_AGE:8h}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
    allow-credentials: true
  template-pre-warm:
    enabled: ${TEMPLATE_PRE_WARM_ENABLED:true}
  generation-event-stream:
    transport: ${GENERATION_EVENT_STREAM_TRANSPORT:redis}
  generation-task-queue:
    transport: ${GENERATION_TASK_QUEUE_TRANSPORT:redis}
  generation-benchmark:
    evidence:
      signing-secret: ${GENERATION_BENCHMARK_EVIDENCE_SIGNING_SECRET}
  generated-code-sandbox:
    container:
      dependency-cache-enabled: ${GENERATED_CODE_SANDBOX_DEPENDENCY_CACHE_ENABLED:true}
  ai-model-capacity:
    enabled: ${AI_MODEL_CAPACITY_ENABLED:true}
    fail-open: ${AI_MODEL_CAPACITY_FAIL_OPEN:false}
  ai-model-secrets:
    active-key-id: ${AI_MODEL_SECRET_ACTIVE_KEY_ID}
    active-key: ${AI_MODEL_SECRET_ACTIVE_KEY}
    fingerprint-key: ${AI_MODEL_SECRET_FINGERPRINT_KEY}
  ai-prompt-catalog:
    runtime-releases:
      enabled: ${AI_PROMPT_RUNTIME_RELEASES_ENABLED:true}
      initial-load-required: ${AI_PROMPT_RUNTIME_RELEASES_INITIAL_LOAD_REQUIRED:true}
  memory:
    long-term:
      enabled: ${MILVUS_MEMORY_ENABLED:true}
      uri: ${MILVUS_URI}
      token: ${MILVUS_TOKEN}
      authentication-required: ${MILVUS_AUTHENTICATION_REQUIRED:true}
      tls-required: ${MILVUS_TLS_REQUIRED:true}
      verify-on-startup: ${MILVUS_VERIFY_ON_STARTUP:true}
    outbox:
      enabled: ${GENERATION_MEMORY_OUTBOX_ENABLED:true}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

knife4j:
  enable: false

management:
  tracing:
    enabled: ${OTEL_TRACING_ENABLED:true}
  otlp:
    tracing:
      export:
        enabled: ${OTEL_TRACING_EXPORT_ENABLED:true}
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:}
  endpoint:
    health:
      show-details: never

code:
  deploy-host: ${CODE_DEPLOY_HOST}
