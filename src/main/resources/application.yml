    enabled: ${OTEL_TRACING_ENABLED:true}
    sampling:
      probability: ${OTEL_TRACING_SAMPLING_PROBABILITY:0.1}
    propagation:
      consume: W3C
      produce: W3C
  otlp:
    tracing:
      export:
        enabled: ${OTEL_TRACING_EXPORT_ENABLED:false}
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:}
      connect-timeout: ${OTEL_EXPORTER_OTLP_CONNECT_TIMEOUT:3s}
      timeout: ${OTEL_EXPORTER_OTLP_TIMEOUT:10s}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db,redis
      show-details: never
