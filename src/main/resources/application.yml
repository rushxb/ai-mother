spring:
  application:
    name: rush-ai-code-mother-backend
  profiles:
    active: "@spring.profiles.active@"
  lifecycle:
    timeout-per-shutdown-phase: 30s
  session:
    store-type: redis
    timeout: ${SESSION_TIMEOUT:12h}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false

logging:
  level:
    # COS SDK logs a full stack trace at INFO during normal shutdown; retain only warnings and errors.
    com.qcloud.cos.http.DefaultCosHttpClient: ${COS_HTTP_CLIENT_LOG_LEVEL:WARN}

server:
  port: ${SERVER_PORT:8123}
  shutdown: graceful
  servlet:
    context-path: /api
    session:
      cookie:
        http-only: true
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
        secure: ${SESSION_COOKIE_SECURE:false}
        max-age: ${SESSION_COOKIE_MAX_AGE:12h}

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
  group-configs:
    - group: default
      paths-to-match: /**
      packages-to-scan: com.rush.rushaicodemother.controller

knife4j:
  enable: ${API_DOCS_ENABLED:false}
  setting:
    language: zh_cn

cos:
  client:
    enabled: ${COS_ENABLED:false}
    host: ${COS_HOST:}
    secret-id: ${COS_SECRET_ID:}
    secret-key: ${COS_SECRET_KEY:}
    region: ${COS_REGION:ap-beijing}
    bucket: ${COS_BUCKET:}

# 仅保留随部署环境变化的配置：密钥与凭据、主机与 URL、容器镜像与配额、端口区间、
# 文件系统根目录、Redis/Stream 命名空间、传输实现、功能开关与节点标识。
# 资源上限、超时、并发度、锁分片、重试次数、SLA 档位、发布门禁阈值等内部策略
# 已下沉到各 *Properties 类的 public static final 常量，并纳入发布配置指纹；
# 调整这些策略需要修改代码并走评审，详见 docs/backend-production-configuration.md。
app:
  background-jobs:
    enabled: ${BACKGROUND_JOBS_ENABLED:true}
  memory:
    long-term:
      enabled: ${MILVUS_MEMORY_ENABLED:false}
      uri: ${MILVUS_URI:}
      token: ${MILVUS_TOKEN:}
      authentication-required: ${MILVUS_AUTHENTICATION_REQUIRED:false}
      tls-required: ${MILVUS_TLS_REQUIRED:false}
      database-name: ${MILVUS_DATABASE:default}
      collection-name: ${MILVUS_MEMORY_COLLECTION:generation_memory_v2}
      verify-on-startup: ${MILVUS_VERIFY_ON_STARTUP:false}
    outbox:
      enabled: ${GENERATION_MEMORY_OUTBOX_ENABLED:true}
  generation-memory-context:
    parallel-reads-enabled: ${GENERATION_MEMORY_CONTEXT_PARALLEL_READS_ENABLED:false}
    preparation-overlap-enabled: ${GENERATION_MEMORY_CONTEXT_PREPARATION_OVERLAP_ENABLED:false}
  rate-limiter:
    lazy-initialization: ${RATE_LIMIT_LAZY_INITIALIZATION:true}
  ai-model-runtime:
    generation-log-requests: ${AI_LOG_REQUESTS:false}
    generation-log-responses: ${AI_LOG_RESPONSES:false}
    routing-log-requests: ${AI_ROUTING_LOG_REQUESTS:false}
    routing-log-responses: ${AI_ROUTING_LOG_RESPONSES:false}
    local-first-heavy-routing-enabled: ${AI_LOCAL_FIRST_HEAVY_ROUTING_ENABLED:true}
    first-token-hedge-enabled: ${AI_FIRST_TOKEN_HEDGE_ENABLED:false}
    intent-clarification-enabled: ${AI_INTENT_CLARIFICATION_ENABLED:false}
  workspace-semantic-index:
    cache:
      maximum-workspaces: ${WORKSPACE_INDEX_MAXIMUM_WORKSPACES:256}
      maximum-indexed-files: ${WORKSPACE_INDEX_MAXIMUM_INDEXED_FILES:50000}
      lock-stripes: ${WORKSPACE_INDEX_LOCK_STRIPES:256}
      expire-after-access: ${WORKSPACE_INDEX_EXPIRE_AFTER_ACCESS:30m}
  ai-model-secrets:
    active-key-id: ${AI_MODEL_SECRET_ACTIVE_KEY_ID:}
    active-key: ${AI_MODEL_SECRET_ACTIVE_KEY:}
    fingerprint-key: ${AI_MODEL_SECRET_FINGERPRINT_KEY:}
    previous-keys: {}
  ai-model-capacity:
    enabled: ${AI_MODEL_CAPACITY_ENABLED:false}
    fail-open: ${AI_MODEL_CAPACITY_FAIL_OPEN:false}
  ai-prompt-catalog:
    enabled: ${AI_PROMPT_CATALOG_ENABLED:true}
    runtime-releases:
      enabled: ${AI_PROMPT_RUNTIME_RELEASES_ENABLED:false}
      initial-load-required: ${AI_PROMPT_RUNTIME_RELEASES_INITIAL_LOAD_REQUIRED:false}
  generation-routing:
    shadow:
      enabled: ${GENERATION_ROUTING_SHADOW_ENABLED:false}
  generation-task-queue:
    transport: ${GENERATION_TASK_QUEUE_TRANSPORT:local}
  generation-benchmark:
    worker:
      enabled: ${GENERATION_BENCHMARK_WORKER_ENABLED:false}
      output-file: ${GENERATION_BENCHMARK_WORKER_OUTPUT_FILE:}
      candidate:
        subject-type: ${GENERATION_BENCHMARK_WORKER_CANDIDATE_TYPE:}
        model-id: ${GENERATION_BENCHMARK_WORKER_MODEL_ID:0}
        prompt-key: ${GENERATION_BENCHMARK_WORKER_PROMPT_KEY:}
        stable-version: ${GENERATION_BENCHMARK_WORKER_STABLE_VERSION:}
        canary-version: ${GENERATION_BENCHMARK_WORKER_CANARY_VERSION:}
        canary-percentage: ${GENERATION_BENCHMARK_WORKER_CANARY_PERCENTAGE:0}
    browser-grading:
      enabled: ${GENERATION_BENCHMARK_BROWSER_GRADING_ENABLED:false}
    backend-grading:
      enabled: ${GENERATION_BENCHMARK_BACKEND_GRADING_ENABLED:false}
      port-range-start: ${GENERATION_BENCHMARK_BACKEND_PORT_RANGE_START:19000}
      port-range-end: ${GENERATION_BENCHMARK_BACKEND_PORT_RANGE_END:19999}
      workspace-root: ${GENERATION_BENCHMARK_BACKEND_WORKSPACE_ROOT:${java.io.tmpdir}/ai-code-mother/benchmark-backend-runtime}
    evidence:
      signing-secret: ${GENERATION_BENCHMARK_EVIDENCE_SIGNING_SECRET:}
      grader-fingerprint: ${GENERATION_BENCHMARK_GRADER_FINGERPRINT:generation-benchmark-graders-v6}
  generation-task-lease:
    owner-id: ${GENERATION_TASK_LEASE_OWNER_ID:}
  generation-event-stream:
    transport: ${GENERATION_EVENT_STREAM_TRANSPORT:local}
    delta-coalescing-enabled: ${GENERATION_EVENT_STREAM_DELTA_COALESCING_ENABLED:true}
  generation-task-snapshot:
    enabled: ${GENERATION_TASK_SNAPSHOT_ENABLED:true}
    replay-safe-start-checkpoint-elision-enabled: ${GENERATION_REPLAY_SAFE_START_CHECKPOINT_ELISION_ENABLED:false}
    replay-safe-completion-checkpoint-coalescing-enabled: ${GENERATION_REPLAY_SAFE_COMPLETION_CHECKPOINT_COALESCING_ENABLED:false}
    root-directory: ${GENERATION_TASK_SNAPSHOT_ROOT_DIRECTORY:${code.orchestration-task-root-dir:${code.tmp-root-dir:${code.base-dir:${user.dir}}/tmp}/orchestration_tasks}}
  edit-state:
    enabled: ${EDIT_STATE_ENABLED:true}
    root-directory: ${EDIT_STATE_ROOT_DIRECTORY:${code.edit-state-root-dir:${code.tmp-root-dir:${code.base-dir:${user.dir}}/tmp}/edit_state}}
  generated-code-sandbox:
    mode: ${GENERATED_CODE_SANDBOX_MODE:container}
    container:
      runtime: ${GENERATED_CODE_SANDBOX_CONTAINER_RUNTIME:docker}
      image: ${GENERATED_CODE_SANDBOX_CONTAINER_IMAGE:ai-code-mother/sandbox-node:1}
      user: ${GENERATED_CODE_SANDBOX_CONTAINER_USER:1000:1000}
      dependency-network: ${GENERATED_CODE_SANDBOX_DEPENDENCY_NETWORK:bridge}
      dev-server-network: ${GENERATED_CODE_SANDBOX_DEV_SERVER_NETWORK:ai-code-sandbox-internal}
      preview-gateway-network: ${GENERATED_CODE_SANDBOX_PREVIEW_GATEWAY_NETWORK:ai-code-sandbox-preview-gateway}
      dependency-cache-enabled: ${GENERATED_CODE_SANDBOX_DEPENDENCY_CACHE_ENABLED:false}
      pnpm-store-volume: ${GENERATED_CODE_SANDBOX_PNPM_STORE_VOLUME:ai-code-mother-pnpm-store-v9}
      memory: ${GENERATED_CODE_SANDBOX_MEMORY:1g}
      tmpfs-size: ${GENERATED_CODE_SANDBOX_TMPFS_SIZE:256m}
      go-build-tmpfs-size: ${GENERATED_CODE_SANDBOX_GO_BUILD_TMPFS_SIZE:512m}
      preview-gateway-memory: ${GENERATED_CODE_SANDBOX_PREVIEW_GATEWAY_MEMORY:128m}
      cpus: ${GENERATED_CODE_SANDBOX_CPUS:1.5}
      pids-limit: ${GENERATED_CODE_SANDBOX_PIDS_LIMIT:128}
      preview-gateway-cpus: ${GENERATED_CODE_SANDBOX_PREVIEW_GATEWAY_CPUS:0.25}
      preview-gateway-pids-limit: ${GENERATED_CODE_SANDBOX_PREVIEW_GATEWAY_PIDS_LIMIT:64}
      read-only-root: ${GENERATED_CODE_SANDBOX_READ_ONLY_ROOT:true}
      verify-on-startup: ${GENERATED_CODE_SANDBOX_VERIFY_ON_STARTUP:true}
  node-toolchain:
    node-executable: ${NODE_TOOLCHAIN_NODE_EXECUTABLE:node}
    pnpm-executable: ${NODE_TOOLCHAIN_PNPM_EXECUTABLE:pnpm}
  go-toolchain:
    go-executable: ${GO_TOOLCHAIN_GO_EXECUTABLE:go}
  dev-server:
    internal-routing:
      base-url-template: ${DEV_SERVER_INTERNAL_BASE_URL_TEMPLATE:http://{nodeId}:8123/api}
      shared-secret: ${DEV_SERVER_INTERNAL_SHARED_SECRET:}
    runtime:
      port-range-start: ${DEV_SERVER_PORT_RANGE_START:10000}
      port-range-end: ${DEV_SERVER_PORT_RANGE_END:60000}
      node-id: ${DEV_SERVER_NODE_ID:}
  screenshot:
    enabled: ${SCREENSHOT_ENABLED:false}
    chrome-driver-path: ${SCREENSHOT_CHROME_DRIVER_PATH:}
    chrome-binary-path: ${SCREENSHOT_CHROME_BINARY_PATH:}
    no-sandbox: ${SCREENSHOT_NO_SANDBOX:false}

management:
  tracing:
    enabled: ${OTEL_TRACING_ENABLED:true}
    sampling:
      probability: ${OTEL_TRACING_SAMPLING_PROBABILITY:0.1}
    propagation:
      consume: W3C
      produce: W3C
  otlp:
    tracing:
      export:
        enabled: ${OTEL_TRACING_EXPORT_ENABLED:false}
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:}
      connect-timeout: ${OTEL_EXPORTER_OTLP_CONNECT_TIMEOUT:3s}
      timeout: ${OTEL_EXPORTER_OTLP_TIMEOUT:10s}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db,redis
      show-details: never
