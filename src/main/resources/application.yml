spring:
  application:
    name: rush-ai-code-mother-backend
  profiles:
    active: @spring.profiles.active@
  lifecycle:
    timeout-per-shutdown-phase: 30s
  session:
    store-type: redis
    timeout: ${SESSION_TIMEOUT:12h}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

logging:
  level:
    # COS SDK logs a full stack trace at INFO during normal shutdown; retain only warnings and errors.
    com.qcloud.cos.http.DefaultCosHttpClient: ${COS_HTTP_CLIENT_LOG_LEVEL:WARN}

server:
  port: ${SERVER_PORT:8123}
  shutdown: graceful
  servlet:
    context-path: /api
    session:
      cookie:
        http-only: true
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
        secure: ${SESSION_COOKIE_SECURE:false}
        max-age: ${SESSION_COOKIE_MAX_AGE:12h}

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
  group-configs:
    - group: default
      paths-to-match: /**
      packages-to-scan: com.rush.rushaicodemother.controller

knife4j:
  enable: ${API_DOCS_ENABLED:false}
  setting:
    language: zh_cn

cos:
  client:
    enabled: ${COS_ENABLED:false}
    host: ${COS_HOST:}
    secret-id: ${COS_SECRET_ID:}
    secret-key: ${COS_SECRET_KEY:}
    region: ${COS_REGION:ap-beijing}
    bucket: ${COS_BUCKET:}

app:
  chat-memory:
    key-prefix: ${CHAT_MEMORY_KEY_PREFIX:chat-memory:}
    ttl-seconds: ${CHAT_MEMORY_TTL_SECONDS:${REDIS_TTL:3600}}
    fallback-max-entries: ${CHAT_MEMORY_FALLBACK_MAX_ENTRIES:1000}
    fallback-expire-after-access: ${CHAT_MEMORY_FALLBACK_EXPIRE_AFTER_ACCESS:2h}
  database-resource:
    url-scheme: ${APP_DATABASE_RESOURCE_URL_SCHEME:https}
    domain: ${APP_DATABASE_RESOURCE_DOMAIN:database.nocode.cn}
    db-engine: ${APP_DATABASE_RESOURCE_ENGINE:SQLite}
    backend-runtime: ${APP_DATABASE_RESOURCE_BACKEND_RUNTIME:go}
    sql-execution-policy: ${APP_DATABASE_RESOURCE_SQL_POLICY:ask_every_time}
  user-credit:
    tokens-per-credit: ${USER_CREDIT_TOKENS_PER_CREDIT:100000}
  rate-limiter:
    lazy-initialization: ${RATE_LIMIT_LAZY_INITIALIZATION:true}
    key-prefix: ${RATE_LIMIT_KEY_PREFIX:rate_limit}
    limiter-idle-ttl: ${RATE_LIMIT_IDLE_TTL:1h}
    forwarded-header-max-length: ${RATE_LIMIT_FORWARDED_HEADER_MAX_LENGTH:4096}
    forwarded-for-max-hops: ${RATE_LIMIT_FORWARDED_FOR_MAX_HOPS:32}
    connection-minimum-idle-size: ${RATE_LIMIT_CONNECTION_MINIMUM_IDLE_SIZE:1}
    connection-pool-size: ${RATE_LIMIT_CONNECTION_POOL_SIZE:10}
    idle-connection-timeout: ${RATE_LIMIT_IDLE_CONNECTION_TIMEOUT:30s}
    connect-timeout: ${RATE_LIMIT_CONNECT_TIMEOUT:5s}
    response-timeout: ${RATE_LIMIT_RESPONSE_TIMEOUT:3s}
    retry-attempts: ${RATE_LIMIT_RETRY_ATTEMPTS:3}
    retry-interval: ${RATE_LIMIT_RETRY_INTERVAL:1500ms}
  ai-model-runtime:
    generation-log-requests: ${AI_LOG_REQUESTS:false}
    generation-log-responses: ${AI_LOG_RESPONSES:false}
    routing-log-requests: ${AI_ROUTING_LOG_REQUESTS:false}
    routing-log-responses: ${AI_ROUTING_LOG_RESPONSES:false}
    generation-timeout: ${AI_GENERATION_TIMEOUT:8m}
    routing-timeout: ${AI_ROUTING_TIMEOUT:30s}
    routing-max-retries: ${AI_ROUTING_MAX_RETRIES:0}
    create-spec-timeout: ${AI_CREATE_SPEC_TIMEOUT:10s}
  redis-cache:
    default-ttl: ${REDIS_CACHE_DEFAULT_TTL:30m}
    cache-ttl:
      good_app_page: ${REDIS_CACHE_GOOD_APP_PAGE_TTL:5m}
  generation-runtime:
    task-timeout: ${GENERATION_TASK_TIMEOUT:20m}
    model-call-timeout: ${GENERATION_MODEL_CALL_TIMEOUT:8m}
    minimum-operation-timeout: ${GENERATION_MINIMUM_OPERATION_TIMEOUT:500ms}
    max-model-attempts: ${GENERATION_MAX_MODEL_ATTEMPTS:3}
    max-tool-writes: ${GENERATION_MAX_TOOL_WRITES:80}
    max-build-executions: ${GENERATION_MAX_BUILD_EXECUTIONS:4}
    max-repair-rounds: ${GENERATION_MAX_REPAIR_ROUNDS:3}
  generation-session:
    lock-stripes: ${GENERATION_SESSION_LOCK_STRIPES:64}
    max-tracked-sessions: ${GENERATION_SESSION_MAX_TRACKED_SESSIONS:1000}
    completed-replay-retention: ${GENERATION_SESSION_COMPLETED_REPLAY_RETENTION:30s}
    cleanup-interval: ${GENERATION_SESSION_CLEANUP_INTERVAL:5s}
  generation-task-snapshot:
    enabled: ${GENERATION_TASK_SNAPSHOT_ENABLED:true}
    root-directory: ${GENERATION_TASK_SNAPSHOT_ROOT_DIRECTORY:${code.orchestration-task-root-dir:${code.tmp-root-dir:${code.base-dir:${user.dir}}/tmp}/orchestration_tasks}}
    max-snapshot-bytes: ${GENERATION_TASK_SNAPSHOT_MAX_BYTES:2097152}
    max-snapshots-per-app: ${GENERATION_TASK_SNAPSHOT_MAX_PER_APP:100}
    retention: ${GENERATION_TASK_SNAPSHOT_RETENTION:7d}
    lock-stripes: ${GENERATION_TASK_SNAPSHOT_LOCK_STRIPES:64}
  edit-state:
    enabled: ${EDIT_STATE_ENABLED:true}
    root-directory: ${EDIT_STATE_ROOT_DIRECTORY:${code.edit-state-root-dir:${code.tmp-root-dir:${code.base-dir:${user.dir}}/tmp}/edit_state}}
    max-cache-entries: ${EDIT_STATE_MAX_CACHE_ENTRIES:1000}
    cache-expire-after-access: ${EDIT_STATE_CACHE_EXPIRE_AFTER_ACCESS:2h}
    state-retention: ${EDIT_STATE_RETENTION:24h}
    max-persisted-apps: ${EDIT_STATE_MAX_PERSISTED_APPS:10000}
    max-state-file-bytes: ${EDIT_STATE_MAX_FILE_BYTES:1048576}
    max-recent-edits: ${EDIT_STATE_MAX_RECENT_EDITS:20}
    max-recent-files: ${EDIT_STATE_MAX_RECENT_FILES:50}
    max-recent-validations: ${EDIT_STATE_MAX_RECENT_VALIDATIONS:20}
    max-task-id-length: ${EDIT_STATE_MAX_TASK_ID_LENGTH:128}
    max-file-path-length: ${EDIT_STATE_MAX_FILE_PATH_LENGTH:1024}
    lock-stripes: ${EDIT_STATE_LOCK_STRIPES:64}
  external-process:
    termination-grace-period: ${EXTERNAL_PROCESS_TERMINATION_GRACE_PERIOD:2s}
  node-toolchain:
    node-executable: ${NODE_TOOLCHAIN_NODE_EXECUTABLE:node}
    pnpm-executable: ${NODE_TOOLCHAIN_PNPM_EXECUTABLE:pnpm}
  project-command:
    tool-script-timeout: ${PROJECT_COMMAND_TOOL_SCRIPT_TIMEOUT:5m}
    light-validation-timeout: ${PROJECT_COMMAND_LIGHT_VALIDATION_TIMEOUT:90s}
    light-build-timeout: ${PROJECT_COMMAND_LIGHT_BUILD_TIMEOUT:3m}
    full-build-timeout: ${PROJECT_COMMAND_FULL_BUILD_TIMEOUT:4m}
    idle-timeout: ${PROJECT_COMMAND_IDLE_TIMEOUT:90s}
    heartbeat-interval: ${PROJECT_COMMAND_HEARTBEAT_INTERVAL:15s}
    output-drain-timeout: ${PROJECT_COMMAND_OUTPUT_DRAIN_TIMEOUT:2s}
    max-output-length: ${PROJECT_COMMAND_MAX_OUTPUT_LENGTH:12000}
    recent-build-result-max-entries: ${PROJECT_COMMAND_RECENT_BUILD_RESULT_MAX_ENTRIES:500}
  workspace-file-system:
    max-files: ${WORKSPACE_MAX_FILES:${PROJECT_COMMAND_SNAPSHOT_MAX_FILES:20000}}
    max-directory-depth: ${WORKSPACE_MAX_DIRECTORY_DEPTH:64}
    max-scanned-bytes: ${WORKSPACE_MAX_SCANNED_BYTES:2147483648}
    max-file-bytes: ${WORKSPACE_MAX_FILE_BYTES:${PROJECT_COMMAND_SNAPSHOT_MAX_FILE_BYTES:104857600}}
    max-readable-file-bytes: ${WORKSPACE_MAX_READABLE_FILE_BYTES:2097152}
    max-interactive-file-bytes: ${WORKSPACE_MAX_INTERACTIVE_FILE_BYTES:1048576}
    max-interactive-tree-depth: ${WORKSPACE_MAX_INTERACTIVE_TREE_DEPTH:8}
    max-copy-bytes: ${WORKSPACE_MAX_COPY_BYTES:2147483648}
    max-persisted-file-bytes: ${WORKSPACE_MAX_PERSISTED_FILE_BYTES:67108864}
    max-listed-directories: ${WORKSPACE_MAX_LISTED_DIRECTORIES:1000}
    publish-max-attempts: ${WORKSPACE_PUBLISH_MAX_ATTEMPTS:5}
    publish-retry-delay-millis: ${WORKSPACE_PUBLISH_RETRY_DELAY_MILLIS:50}
  generation-project-context:
    max-project-index-files: ${GENERATION_CONTEXT_MAX_PROJECT_INDEX_FILES:80}
    max-single-file-chars: ${GENERATION_CONTEXT_MAX_SINGLE_FILE_CHARS:12000}
    max-total-context-chars: ${GENERATION_CONTEXT_MAX_TOTAL_CONTEXT_CHARS:100000}
    max-readable-file-bytes: ${GENERATION_CONTEXT_MAX_READABLE_FILE_BYTES:1048576}
  edit-locator:
    max-candidate-files: ${EDIT_LOCATOR_MAX_CANDIDATE_FILES:8}
    max-single-file-chars: ${EDIT_LOCATOR_MAX_SINGLE_FILE_CHARS:20480}
    max-total-context-chars: ${EDIT_LOCATOR_MAX_TOTAL_CONTEXT_CHARS:61440}
    max-scanned-files: ${EDIT_LOCATOR_MAX_SCANNED_FILES:20000}
    max-readable-file-bytes: ${EDIT_LOCATOR_MAX_READABLE_FILE_BYTES:2097152}
    max-project-index-files: ${EDIT_LOCATOR_MAX_PROJECT_INDEX_FILES:80}
  patch-execution:
    max-operations: ${PATCH_MAX_OPERATIONS:100}
    max-operation-content-chars: ${PATCH_MAX_OPERATION_CONTENT_CHARS:1000000}
    max-total-content-chars: ${PATCH_MAX_TOTAL_CONTENT_CHARS:5000000}
    max-readable-file-bytes: ${PATCH_MAX_READABLE_FILE_BYTES:5242880}
    max-written-file-bytes: ${PATCH_MAX_WRITTEN_FILE_BYTES:10485760}
    max-rollback-snapshot-bytes: ${PATCH_MAX_ROLLBACK_SNAPSHOT_BYTES:20971520}
  ai-tool-workspace:
    max-readable-file-bytes: ${AI_TOOL_MAX_READABLE_FILE_BYTES:1048576}
    max-directory-entries: ${AI_TOOL_MAX_DIRECTORY_ENTRIES:5000}
    max-directory-depth: ${AI_TOOL_MAX_DIRECTORY_DEPTH:32}
  generation-commit:
    command-timeout: ${GENERATION_COMMIT_COMMAND_TIMEOUT:10s}
    heartbeat-interval: ${GENERATION_COMMIT_HEARTBEAT_INTERVAL:2s}
    output-drain-timeout: ${GENERATION_COMMIT_OUTPUT_DRAIN_TIMEOUT:2s}
    max-output-length: ${GENERATION_COMMIT_MAX_OUTPUT_LENGTH:8000}
    lock-stripes: ${GENERATION_COMMIT_LOCK_STRIPES:64}
    max-files-per-commit: ${GENERATION_COMMIT_MAX_FILES_PER_COMMIT:20000}
    max-pathspec-bytes: ${GENERATION_COMMIT_MAX_PATHSPEC_BYTES:2097152}
  artifact-lifecycle:
    copy-timeout: ${ARTIFACT_COPY_TIMEOUT:15m}
    heartbeat-interval: ${ARTIFACT_COPY_HEARTBEAT_INTERVAL:30s}
    output-drain-timeout: ${ARTIFACT_COPY_OUTPUT_DRAIN_TIMEOUT:5s}
    max-output-length: ${ARTIFACT_COPY_MAX_OUTPUT_LENGTH:8000}
    max-files: ${ARTIFACT_COPY_MAX_FILES:20000}
    max-directories: ${ARTIFACT_COPY_MAX_DIRECTORIES:5000}
    max-directory-depth: ${ARTIFACT_COPY_MAX_DIRECTORY_DEPTH:64}
    max-file-bytes: ${ARTIFACT_COPY_MAX_FILE_BYTES:104857600}
    max-total-bytes: ${ARTIFACT_COPY_MAX_TOTAL_BYTES:2147483648}
    publish-max-attempts: ${ARTIFACT_PUBLISH_MAX_ATTEMPTS:5}
    publish-retry-delay-millis: ${ARTIFACT_PUBLISH_RETRY_DELAY_MILLIS:50}
  dev-server:
    proxy:
      connect-timeout: ${DEV_SERVER_CONNECT_TIMEOUT:3s}
      request-timeout: ${DEV_SERVER_REQUEST_TIMEOUT:30s}
      max-request-body: ${DEV_SERVER_MAX_REQUEST_BODY:2MB}
      max-response-body: ${DEV_SERVER_MAX_RESPONSE_BODY:25MB}
    runtime:
      startup-timeout: ${DEV_SERVER_STARTUP_TIMEOUT:30s}
      readiness-poll-interval: ${DEV_SERVER_READINESS_POLL_INTERVAL:200ms}
      validation-error-collection-window: ${DEV_SERVER_VALIDATION_ERROR_COLLECTION_WINDOW:5s}
      output-drain-timeout: ${DEV_SERVER_OUTPUT_DRAIN_TIMEOUT:2s}
      stop-timeout: ${DEV_SERVER_STOP_TIMEOUT:10s}
      port-range-start: ${DEV_SERVER_PORT_RANGE_START:10000}
      port-range-end: ${DEV_SERVER_PORT_RANGE_END:60000}
      max-servers-per-user: ${DEV_SERVER_MAX_SERVERS_PER_USER:3}
      max-output-line-length: ${DEV_SERVER_MAX_OUTPUT_LINE_LENGTH:2000}
      max-recent-output-lines: ${DEV_SERVER_MAX_RECENT_OUTPUT_LINES:200}
  dependency-install:
    command-timeout: ${DEPENDENCY_INSTALL_COMMAND_TIMEOUT:5m}
    idle-timeout: ${DEPENDENCY_INSTALL_IDLE_TIMEOUT:90s}
    heartbeat-interval: ${DEPENDENCY_INSTALL_HEARTBEAT_INTERVAL:15s}
    runtime-validation-timeout: ${DEPENDENCY_RUNTIME_VALIDATION_TIMEOUT:30s}
    output-drain-timeout: ${DEPENDENCY_OUTPUT_DRAIN_TIMEOUT:2s}
    max-attempts: ${DEPENDENCY_INSTALL_MAX_ATTEMPTS:3}
    max-output-length: ${DEPENDENCY_INSTALL_MAX_OUTPUT_LENGTH:12000}
    lock-stripes: ${DEPENDENCY_INSTALL_LOCK_STRIPES:64}
  template-materialization:
    max-files: ${TEMPLATE_MATERIALIZATION_MAX_FILES:2000}
    max-file-bytes: ${TEMPLATE_MATERIALIZATION_MAX_FILE_BYTES:10485760}
    max-total-bytes: ${TEMPLATE_MATERIALIZATION_MAX_TOTAL_BYTES:104857600}
    max-relative-path-length: ${TEMPLATE_MATERIALIZATION_MAX_RELATIVE_PATH_LENGTH:1024}
    max-directory-depth: ${TEMPLATE_MATERIALIZATION_MAX_DIRECTORY_DEPTH:32}
    publish-max-attempts: ${TEMPLATE_MATERIALIZATION_PUBLISH_MAX_ATTEMPTS:5}
    publish-retry-delay-millis: ${TEMPLATE_MATERIALIZATION_PUBLISH_RETRY_DELAY_MILLIS:50}
  template-pre-warm:
    max-concurrency: ${TEMPLATE_PRE_WARM_MAX_CONCURRENCY:2}
    template-ids:
      - vue-web-basic
      - vue-web-admin
      - vue-web-mobile
      - vue-web-landing
  screenshot:
    enabled: ${SCREENSHOT_ENABLED:false}
    chrome-driver-path: ${SCREENSHOT_CHROME_DRIVER_PATH:}
    chrome-binary-path: ${SCREENSHOT_CHROME_BINARY_PATH:}
    max-concurrency: ${SCREENSHOT_MAX_CONCURRENCY:2}
    queue-capacity: ${SCREENSHOT_QUEUE_CAPACITY:16}
    viewport-width: ${SCREENSHOT_VIEWPORT_WIDTH:1600}
    viewport-height: ${SCREENSHOT_VIEWPORT_HEIGHT:900}
    page-load-timeout: ${SCREENSHOT_PAGE_LOAD_TIMEOUT:30s}
    ready-state-timeout: ${SCREENSHOT_READY_STATE_TIMEOUT:15s}
    post-load-delay: ${SCREENSHOT_POST_LOAD_DELAY:2s}
    compression-quality: ${SCREENSHOT_COMPRESSION_QUALITY:0.3}
    no-sandbox: ${SCREENSHOT_NO_SANDBOX:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db,redis
      show-details: never
