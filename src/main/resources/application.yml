spring:
  application:
    name: rush-ai-code-mother-backend
  profiles:
    active: "@spring.profiles.active@"
  lifecycle:
    timeout-per-shutdown-phase: 30s
  session:
    store-type: redis
    timeout: ${SESSION_TIMEOUT:12h}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false

logging:
  level:
    # COS SDK logs a full stack trace at INFO during normal shutdown; retain only warnings and errors.
    com.qcloud.cos.http.DefaultCosHttpClient: ${COS_HTTP_CLIENT_LOG_LEVEL:WARN}

server:
  port: ${SERVER_PORT:8123}
  shutdown: graceful
  servlet:
    context-path: /api
    session:
      cookie:
        http-only: true
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
        secure: ${SESSION_COOKIE_SECURE:false}
        max-age: ${SESSION_COOKIE_MAX_AGE:12h}

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
  group-configs:
    - group: default
      paths-to-match: /**
      packages-to-scan: com.rush.rushaicodemother.controller

knife4j:
  enable: ${API_DOCS_ENABLED:false}
  setting:
    language: zh_cn

cos:
  client:
    enabled: ${COS_ENABLED:false}
    host: ${COS_HOST:}
    secret-id: ${COS_SECRET_ID:}
    secret-key: ${COS_SECRET_KEY:}
    region: ${COS_REGION:ap-beijing}
    bucket: ${COS_BUCKET:}

app:
  background-jobs:
    enabled: ${BACKGROUND_JOBS_ENABLED:true}
  chat-memory:
    key-prefix: ${CHAT_MEMORY_KEY_PREFIX:chat-memory:}
    ttl-seconds: ${CHAT_MEMORY_TTL_SECONDS:${REDIS_TTL:3600}}
    fallback-max-entries: ${CHAT_MEMORY_FALLBACK_MAX_ENTRIES:1000}
    fallback-expire-after-access: ${CHAT_MEMORY_FALLBACK_EXPIRE_AFTER_ACCESS:2h}
    completed-tool-arguments-max-chars: ${CHAT_MEMORY_COMPLETED_TOOL_ARGUMENTS_MAX_CHARS:8192}
  memory:
    working:
      max-tasks: ${WORKING_MEMORY_MAX_TASKS:2000}
      retention: ${WORKING_MEMORY_RETENTION:2h}
      max-recent-events: ${WORKING_MEMORY_MAX_RECENT_EVENTS:100}
    long-term:
      enabled: ${MILVUS_MEMORY_ENABLED:false}
      uri: ${MILVUS_URI:}
      token: ${MILVUS_TOKEN:}
      authentication-required: ${MILVUS_AUTHENTICATION_REQUIRED:false}
      tls-required: ${MILVUS_TLS_REQUIRED:false}
      database-name: ${MILVUS_DATABASE:default}
      collection-name: ${MILVUS_MEMORY_COLLECTION:generation_memory_v2}
      connect-timeout: ${MILVUS_CONNECT_TIMEOUT:3s}
      request-timeout: ${MILVUS_REQUEST_TIMEOUT:5s}
      readiness-timeout: ${MILVUS_READINESS_TIMEOUT:60s}
      readiness-refresh-interval: ${MILVUS_READINESS_REFRESH_INTERVAL:30s}
      verify-on-startup: ${MILVUS_VERIFY_ON_STARTUP:false}
      fallback-max-entries: ${MILVUS_FALLBACK_MAX_ENTRIES:5000}
      fallback-retention: ${MILVUS_FALLBACK_RETENTION:12h}
      default-top-k: ${MILVUS_MEMORY_TOP_K:6}
      minimum-score: ${MILVUS_MEMORY_MINIMUM_SCORE:0.45}
    outbox:
      enabled: ${GENERATION_MEMORY_OUTBOX_ENABLED:true}
      scan-interval: ${GENERATION_MEMORY_OUTBOX_SCAN_INTERVAL:30s}
      batch-size: ${GENERATION_MEMORY_OUTBOX_BATCH_SIZE:50}
      max-attempts: ${GENERATION_MEMORY_OUTBOX_MAX_ATTEMPTS:10}
      lease-duration: ${GENERATION_MEMORY_OUTBOX_LEASE_DURATION:2m}
      initial-retry-delay: ${GENERATION_MEMORY_OUTBOX_INITIAL_RETRY_DELAY:30s}
      max-retry-delay: ${GENERATION_MEMORY_OUTBOX_MAX_RETRY_DELAY:1h}
  generation-memory-context:
    parallel-reads-enabled: ${GENERATION_MEMORY_CONTEXT_PARALLEL_READS_ENABLED:false}
    max-concurrent-reads: ${GENERATION_MEMORY_CONTEXT_MAX_CONCURRENT_READS:12}
    preparation-overlap-enabled: ${GENERATION_MEMORY_CONTEXT_PREPARATION_OVERLAP_ENABLED:false}
    max-concurrent-preparation-overlaps: ${GENERATION_MEMORY_CONTEXT_MAX_CONCURRENT_PREPARATION_OVERLAPS:4}
    preparation-overlap-timeout: ${GENERATION_MEMORY_CONTEXT_PREPARATION_OVERLAP_TIMEOUT:30s}
    shutdown-timeout: ${GENERATION_MEMORY_CONTEXT_SHUTDOWN_TIMEOUT:10s}
  database-resource:
    url-scheme: ${APP_DATABASE_RESOURCE_URL_SCHEME:https}
    domain: ${APP_DATABASE_RESOURCE_DOMAIN:database.nocode.cn}
    db-engine: ${APP_DATABASE_RESOURCE_ENGINE:SQLite}
    backend-runtime: ${APP_DATABASE_RESOURCE_BACKEND_RUNTIME:go}
    sql-execution-policy: ${APP_DATABASE_RESOURCE_SQL_POLICY:ask_every_time}
  user-credit:
    tokens-per-credit: ${USER_CREDIT_TOKENS_PER_CREDIT:100000}
    settlement-batch-size: ${USER_CREDIT_SETTLEMENT_BATCH_SIZE:100}
    settlement-scan-interval: ${USER_CREDIT_SETTLEMENT_SCAN_INTERVAL:30s}
    reservation:
      policy-version: ${USER_CREDIT_RESERVATION_POLICY_VERSION:route-token-budget-v1}
      create-estimated-tokens: ${USER_CREDIT_CREATE_ESTIMATED_TOKENS:150000}
      light-edit-estimated-tokens: ${USER_CREDIT_LIGHT_EDIT_ESTIMATED_TOKENS:80000}
      agent-edit-estimated-tokens: ${USER_CREDIT_AGENT_EDIT_ESTIMATED_TOKENS:300000}
      heavy-expert-estimated-tokens: ${USER_CREDIT_HEAVY_EXPERT_ESTIMATED_TOKENS:600000}
      html-multiplier-percent: ${USER_CREDIT_HTML_MULTIPLIER_PERCENT:75}
      multi-file-multiplier-percent: ${USER_CREDIT_MULTI_FILE_MULTIPLIER_PERCENT:100}
      vue-project-multiplier-percent: ${USER_CREDIT_VUE_PROJECT_MULTIPLIER_PERCENT:120}
      backend-project-multiplier-percent: ${USER_CREDIT_BACKEND_PROJECT_MULTIPLIER_PERCENT:150}
      full-stack-project-multiplier-percent: ${USER_CREDIT_FULL_STACK_PROJECT_MULTIPLIER_PERCENT:175}
  rate-limiter:
    lazy-initialization: ${RATE_LIMIT_LAZY_INITIALIZATION:true}
    key-prefix: ${RATE_LIMIT_KEY_PREFIX:rate_limit}
    limiter-idle-ttl: ${RATE_LIMIT_IDLE_TTL:1h}
    forwarded-header-max-length: ${RATE_LIMIT_FORWARDED_HEADER_MAX_LENGTH:4096}
    forwarded-for-max-hops: ${RATE_LIMIT_FORWARDED_FOR_MAX_HOPS:32}
    connection-minimum-idle-size: ${RATE_LIMIT_CONNECTION_MINIMUM_IDLE_SIZE:1}
    connection-pool-size: ${RATE_LIMIT_CONNECTION_POOL_SIZE:10}
    idle-connection-timeout: ${RATE_LIMIT_IDLE_CONNECTION_TIMEOUT:30s}
    connect-timeout: ${RATE_LIMIT_CONNECT_TIMEOUT:5s}
    response-timeout: ${RATE_LIMIT_RESPONSE_TIMEOUT:3s}
    retry-attempts: ${RATE_LIMIT_RETRY_ATTEMPTS:3}
    retry-interval: ${RATE_LIMIT_RETRY_INTERVAL:1500ms}
  ai-model-runtime:
    generation-log-requests: ${AI_LOG_REQUESTS:false}
    generation-log-responses: ${AI_LOG_RESPONSES:false}
    routing-log-requests: ${AI_ROUTING_LOG_REQUESTS:false}
    routing-log-responses: ${AI_ROUTING_LOG_RESPONSES:false}
    generation-timeout: ${AI_GENERATION_TIMEOUT:4m}
    first-signal-timeout: ${AI_FIRST_SIGNAL_TIMEOUT:45s}
    routing-timeout: ${AI_ROUTING_TIMEOUT:30s}
    routing-max-retries: ${AI_ROUTING_MAX_RETRIES:0}
    failover-max-candidates: ${AI_FAILOVER_MAX_CANDIDATES:2}
    local-first-heavy-routing-enabled: ${AI_LOCAL_FIRST_HEAVY_ROUTING_ENABLED:true}
    first-token-hedge-enabled: ${AI_FIRST_TOKEN_HEDGE_ENABLED:false}
    first-token-hedge-delay: ${AI_FIRST_TOKEN_HEDGE_DELAY:3s}
    first-token-hedge-require-distinct-provider: ${AI_FIRST_TOKEN_HEDGE_REQUIRE_DISTINCT_PROVIDER:true}
    root-model-retry-min-delay: ${AI_ROOT_MODEL_RETRY_MIN_DELAY:3s}
    root-model-retry-max-delay: ${AI_ROOT_MODEL_RETRY_MAX_DELAY:20s}
    root-model-retry-jitter: ${AI_ROOT_MODEL_RETRY_JITTER:0.35}
    create-spec-timeout: ${AI_CREATE_SPEC_TIMEOUT:10s}
  ai-model-secrets:
    active-key-id: ${AI_MODEL_SECRET_ACTIVE_KEY_ID:}
    active-key: ${AI_MODEL_SECRET_ACTIVE_KEY:}
    fingerprint-key: ${AI_MODEL_SECRET_FINGERPRINT_KEY:}
    previous-keys: {}
    max-secret-bytes: ${AI_MODEL_SECRET_MAX_BYTES:2048}
    max-reference-bytes: ${AI_MODEL_SECRET_MAX_REFERENCE_BYTES:4096}
  ai-model-capacity:
    enabled: ${AI_MODEL_CAPACITY_ENABLED:false}
    key-prefix: ${AI_MODEL_CAPACITY_KEY_PREFIX:ai:model:capacity:}
    max-concurrent-per-model: ${AI_MODEL_MAX_CONCURRENT_PER_MODEL:4}
    requests-per-minute: ${AI_MODEL_REQUESTS_PER_MINUTE:120}
    tokens-per-minute: ${AI_MODEL_TOKENS_PER_MINUTE:500000}
    max-reserved-output-tokens: ${AI_MODEL_MAX_RESERVED_OUTPUT_TOKENS:16384}
    acquire-timeout: ${AI_MODEL_CAPACITY_ACQUIRE_TIMEOUT:250ms}
    permit-lease: ${AI_MODEL_CAPACITY_PERMIT_LEASE:60s}
    heartbeat-interval: ${AI_MODEL_CAPACITY_HEARTBEAT_INTERVAL:20s}
    maximum-hold: ${AI_MODEL_CAPACITY_MAXIMUM_HOLD:16m}
    maximum-hold-grace: ${AI_MODEL_CAPACITY_MAXIMUM_HOLD_GRACE:30s}
    scheduler-threads: ${AI_MODEL_CAPACITY_SCHEDULER_THREADS:2}
    idle-ttl: ${AI_MODEL_CAPACITY_IDLE_TTL:2h}
    fail-open: ${AI_MODEL_CAPACITY_FAIL_OPEN:false}
  ai-prompt-catalog:
    enabled: ${AI_PROMPT_CATALOG_ENABLED:true}
    manifest: ${AI_PROMPT_CATALOG_MANIFEST:classpath:prompt/prompt-catalog.json}
    rollout-salt: ${AI_PROMPT_ROLLOUT_SALT:ai-code-mother-prompt-rollout-v1}
    runtime-releases:
      enabled: ${AI_PROMPT_RUNTIME_RELEASES_ENABLED:false}
      initial-load-required: ${AI_PROMPT_RUNTIME_RELEASES_INITIAL_LOAD_REQUIRED:false}
      refresh-interval: ${AI_PROMPT_RUNTIME_RELEASES_REFRESH_INTERVAL:5s}
  ai-model-circuit-breaker:
    failure-threshold: ${AI_MODEL_CIRCUIT_FAILURE_THRESHOLD:1}
    open-duration: ${AI_MODEL_CIRCUIT_OPEN_DURATION:30s}
    max-tracked-models: ${AI_MODEL_CIRCUIT_MAX_TRACKED_MODELS:200}
  redis-cache:
    default-ttl: ${REDIS_CACHE_DEFAULT_TTL:30m}
    cache-ttl:
      good_app_page: ${REDIS_CACHE_GOOD_APP_PAGE_TTL:5m}
  generation-sla:
    profiles:
      CREATE:
        name: create-preview-first
        first-preview-timeout: ${GENERATION_CREATE_FIRST_PREVIEW_TIMEOUT:60s}
        first-preview-completion-reserve: ${GENERATION_CREATE_FIRST_PREVIEW_COMPLETION_RESERVE:45s}
        total-timeout: ${GENERATION_CREATE_TOTAL_TIMEOUT:10m}
        model-call-timeout: ${GENERATION_CREATE_MODEL_CALL_TIMEOUT:2m}
        minimum-operation-timeout: ${GENERATION_MINIMUM_OPERATION_TIMEOUT:500ms}
        max-root-model-attempts: ${GENERATION_CREATE_MAX_ROOT_MODEL_ATTEMPTS:${GENERATION_CREATE_MAX_MODEL_ATTEMPTS:4}}
        max-model-turns: ${GENERATION_CREATE_MAX_MODEL_TURNS:18}
        max-provider-failover-attempts: ${GENERATION_CREATE_MAX_PROVIDER_FAILOVER_ATTEMPTS:4}
        max-tool-writes: ${GENERATION_CREATE_MAX_TOOL_WRITES:40}
        max-build-executions: ${GENERATION_CREATE_MAX_BUILD_EXECUTIONS:2}
        max-repair-rounds: ${GENERATION_CREATE_MAX_REPAIR_ROUNDS:1}
      LIGHT_EDIT:
        name: light-edit-fast
        first-preview-timeout: ${GENERATION_LIGHT_EDIT_FIRST_PREVIEW_TIMEOUT:90s}
        first-preview-completion-reserve: ${GENERATION_LIGHT_EDIT_FIRST_PREVIEW_COMPLETION_RESERVE:30s}
        total-timeout: ${GENERATION_LIGHT_EDIT_TOTAL_TIMEOUT:4m}
        model-call-timeout: ${GENERATION_LIGHT_EDIT_MODEL_CALL_TIMEOUT:90s}
        minimum-operation-timeout: ${GENERATION_MINIMUM_OPERATION_TIMEOUT:500ms}
        max-root-model-attempts: ${GENERATION_LIGHT_EDIT_MAX_ROOT_MODEL_ATTEMPTS:${GENERATION_LIGHT_EDIT_MAX_MODEL_ATTEMPTS:2}}
        max-model-turns: ${GENERATION_LIGHT_EDIT_MAX_MODEL_TURNS:4}
        max-provider-failover-attempts: ${GENERATION_LIGHT_EDIT_MAX_PROVIDER_FAILOVER_ATTEMPTS:2}
        max-tool-writes: ${GENERATION_LIGHT_EDIT_MAX_TOOL_WRITES:12}
        max-build-executions: ${GENERATION_LIGHT_EDIT_MAX_BUILD_EXECUTIONS:1}
        max-repair-rounds: ${GENERATION_LIGHT_EDIT_MAX_REPAIR_ROUNDS:1}
      AGENT_EDIT:
        name: agent-edit-balanced
        first-preview-timeout: ${GENERATION_AGENT_EDIT_FIRST_PREVIEW_TIMEOUT:3m}
        first-preview-completion-reserve: ${GENERATION_AGENT_EDIT_FIRST_PREVIEW_COMPLETION_RESERVE:45s}
        total-timeout: ${GENERATION_AGENT_EDIT_TOTAL_TIMEOUT:8m}
        model-call-timeout: ${GENERATION_AGENT_EDIT_MODEL_CALL_TIMEOUT:3m}
        minimum-operation-timeout: ${GENERATION_MINIMUM_OPERATION_TIMEOUT:500ms}
        max-root-model-attempts: ${GENERATION_AGENT_EDIT_MAX_ROOT_MODEL_ATTEMPTS:${GENERATION_AGENT_EDIT_MAX_MODEL_ATTEMPTS:2}}
        max-model-turns: ${GENERATION_AGENT_EDIT_MAX_MODEL_TURNS:12}
        max-provider-failover-attempts: ${GENERATION_AGENT_EDIT_MAX_PROVIDER_FAILOVER_ATTEMPTS:4}
        max-tool-writes: ${GENERATION_AGENT_EDIT_MAX_TOOL_WRITES:48}
        max-build-executions: ${GENERATION_AGENT_EDIT_MAX_BUILD_EXECUTIONS:2}
        max-repair-rounds: ${GENERATION_AGENT_EDIT_MAX_REPAIR_ROUNDS:1}
      HEAVY_EXPERT:
        name: heavy-expert-quality
        first-preview-timeout: ${GENERATION_HEAVY_FIRST_PREVIEW_TIMEOUT:5m}
        first-preview-completion-reserve: ${GENERATION_HEAVY_FIRST_PREVIEW_COMPLETION_RESERVE:60s}
        total-timeout: ${GENERATION_HEAVY_TOTAL_TIMEOUT:15m}
        model-call-timeout: ${GENERATION_HEAVY_MODEL_CALL_TIMEOUT:4m}
        minimum-operation-timeout: ${GENERATION_MINIMUM_OPERATION_TIMEOUT:500ms}
        max-root-model-attempts: ${GENERATION_HEAVY_MAX_ROOT_MODEL_ATTEMPTS:${GENERATION_HEAVY_MAX_MODEL_ATTEMPTS:4}}
        max-model-turns: ${GENERATION_HEAVY_MAX_MODEL_TURNS:24}
        max-provider-failover-attempts: ${GENERATION_HEAVY_MAX_PROVIDER_FAILOVER_ATTEMPTS:6}
        max-tool-writes: ${GENERATION_HEAVY_MAX_TOOL_WRITES:120}
        max-build-executions: ${GENERATION_HEAVY_MAX_BUILD_EXECUTIONS:3}
        max-repair-rounds: ${GENERATION_HEAVY_MAX_REPAIR_ROUNDS:2}
    saturated-agent-edit:
      name: agent-edit-saturated
      first-preview-timeout: ${GENERATION_SATURATED_FIRST_PREVIEW_TIMEOUT:2m}
      first-preview-completion-reserve: ${GENERATION_SATURATED_FIRST_PREVIEW_COMPLETION_RESERVE:30s}
      total-timeout: ${GENERATION_SATURATED_TOTAL_TIMEOUT:6m}
      model-call-timeout: ${GENERATION_SATURATED_MODEL_CALL_TIMEOUT:2m}
      minimum-operation-timeout: ${GENERATION_MINIMUM_OPERATION_TIMEOUT:500ms}
      max-root-model-attempts: ${GENERATION_SATURATED_MAX_ROOT_MODEL_ATTEMPTS:${GENERATION_SATURATED_MAX_MODEL_ATTEMPTS:2}}
      max-model-turns: ${GENERATION_SATURATED_MAX_MODEL_TURNS:8}
      max-provider-failover-attempts: ${GENERATION_SATURATED_MAX_PROVIDER_FAILOVER_ATTEMPTS:2}
      max-tool-writes: ${GENERATION_SATURATED_MAX_TOOL_WRITES:24}
      max-build-executions: ${GENERATION_SATURATED_MAX_BUILD_EXECUTIONS:1}
      max-repair-rounds: ${GENERATION_SATURATED_MAX_REPAIR_ROUNDS:1}
  generation-stage-admission:
    model-turn-minimum: ${GENERATION_STAGE_MODEL_TURN_MINIMUM:30s}
    model-handoff-reserve: ${GENERATION_STAGE_MODEL_HANDOFF_RESERVE:2s}
    repair-model-minimum: ${GENERATION_STAGE_REPAIR_MODEL_MINIMUM:60s}
    build-minimum: ${GENERATION_STAGE_BUILD_MINIMUM:45s}
    runtime-validation-minimum: ${GENERATION_STAGE_RUNTIME_VALIDATION_MINIMUM:15s}
    terminalization-reserve: ${GENERATION_STAGE_TERMINALIZATION_RESERVE:10s}
  ai-context-pack:
    generation-max-tokens: ${AI_CONTEXT_PACK_GENERATION_MAX_TOKENS:2000}
    repair-max-tokens: ${AI_CONTEXT_PACK_REPAIR_MAX_TOKENS:1500}
    tokenizer-model: ${AI_CONTEXT_PACK_TOKENIZER_MODEL:gpt-4o}
    token-safety-margin: ${AI_CONTEXT_PACK_TOKEN_SAFETY_MARGIN:1.15}
    max-section-tokens: ${AI_CONTEXT_PACK_MAX_SECTION_TOKENS:800}
    minimum-section-tokens: ${AI_CONTEXT_PACK_MINIMUM_SECTION_TOKENS:64}
    max-semantic-memory-sections: ${AI_CONTEXT_PACK_MAX_SEMANTIC_MEMORY_SECTIONS:6}
    semantic-memory-half-life: ${AI_CONTEXT_PACK_SEMANTIC_MEMORY_HALF_LIFE:30d}
    minimum-semantic-trust: ${AI_CONTEXT_PACK_MINIMUM_SEMANTIC_TRUST:0.25}
  generation-runtime:
    task-timeout: ${GENERATION_TASK_TIMEOUT:10m}
    model-call-timeout: ${GENERATION_MODEL_CALL_TIMEOUT:4m}
    minimum-operation-timeout: ${GENERATION_MINIMUM_OPERATION_TIMEOUT:500ms}
    first-preview-completion-reserve: ${GENERATION_FIRST_PREVIEW_COMPLETION_RESERVE:10s}
    stream-snapshot-update-interval: ${GENERATION_STREAM_SNAPSHOT_UPDATE_INTERVAL:5s}
    stream-snapshot-max-chars: ${GENERATION_STREAM_SNAPSHOT_MAX_CHARS:20000}
    max-root-model-attempts: ${GENERATION_MAX_ROOT_MODEL_ATTEMPTS:${GENERATION_MAX_MODEL_ATTEMPTS:3}}
    max-model-turns: ${GENERATION_MAX_MODEL_TURNS:16}
    max-provider-failover-attempts: ${GENERATION_MAX_PROVIDER_FAILOVER_ATTEMPTS:4}
    max-tool-writes: ${GENERATION_MAX_TOOL_WRITES:80}
    max-build-executions: ${GENERATION_MAX_BUILD_EXECUTIONS:2}
    max-repair-rounds: ${GENERATION_MAX_REPAIR_ROUNDS:1}
  generation-task-executor:
    max-concurrency: ${GENERATION_TASK_MAX_CONCURRENCY:4}
    queue-capacity: ${GENERATION_TASK_QUEUE_CAPACITY:32}
    shutdown-timeout: ${GENERATION_TASK_EXECUTOR_SHUTDOWN_TIMEOUT:30s}
    queue-policy-check-interval: ${GENERATION_TASK_QUEUE_POLICY_CHECK_INTERVAL:250ms}
  generation-routing:
    telemetry:
      task-sample-limit: ${GENERATION_ROUTING_TASK_SAMPLE_LIMIT:20}
      minimum-task-samples: ${GENERATION_ROUTING_MINIMUM_TASK_SAMPLES:4}
      high-failure-rate: ${GENERATION_ROUTING_HIGH_FAILURE_RATE:0.5}
      minimum-feedback-samples: ${GENERATION_ROUTING_MINIMUM_FEEDBACK_SAMPLES:2}
      high-low-rating-rate: ${GENERATION_ROUTING_HIGH_LOW_RATING_RATE:0.5}
      high-load-ratio: ${GENERATION_ROUTING_HIGH_LOAD_RATIO:0.8}
      slow-average-duration: ${GENERATION_ROUTING_SLOW_AVERAGE_DURATION:10m}
      cache-ttl: ${GENERATION_ROUTING_TELEMETRY_CACHE_TTL:30s}
      max-cached-applications: ${GENERATION_ROUTING_MAX_CACHED_APPLICATIONS:10000}
  generation-task-queue:
    transport: ${GENERATION_TASK_QUEUE_TRANSPORT:local}
    stream-key: ${GENERATION_TASK_QUEUE_STREAM_KEY:generation:tasks}
    group: ${GENERATION_TASK_QUEUE_GROUP:generation-workers}
    dead-letter-stream-key: ${GENERATION_TASK_QUEUE_DLQ_KEY:generation:tasks:dlq}
    poll-timeout: ${GENERATION_TASK_QUEUE_POLL_TIMEOUT:2s}
    visibility-timeout: ${GENERATION_TASK_QUEUE_VISIBILITY_TIMEOUT:45s}
    delivery-heartbeat-interval: ${GENERATION_TASK_QUEUE_DELIVERY_HEARTBEAT_INTERVAL:10s}
    redispatch-interval: ${GENERATION_TASK_QUEUE_REDISPATCH_INTERVAL:15s}
    redispatch-after: ${GENERATION_TASK_QUEUE_REDISPATCH_AFTER:30s}
    read-batch-size: ${GENERATION_TASK_QUEUE_READ_BATCH_SIZE:8}
    reclaim-batch-size: ${GENERATION_TASK_QUEUE_RECLAIM_BATCH_SIZE:16}
    max-delivery-attempts: ${GENERATION_TASK_QUEUE_MAX_DELIVERY_ATTEMPTS:5}
    max-stream-length: ${GENERATION_TASK_QUEUE_MAX_STREAM_LENGTH:100000}
    redispatch-batch-size: ${GENERATION_TASK_QUEUE_REDISPATCH_BATCH_SIZE:100}
  generation-progress:
    task-sample-limit: ${GENERATION_PROGRESS_TASK_SAMPLE_LIMIT:200}
    span-sample-limit: ${GENERATION_PROGRESS_SPAN_SAMPLE_LIMIT:5000}
    minimum-historical-samples: ${GENERATION_PROGRESS_MINIMUM_HISTORICAL_SAMPLES:8}
    high-confidence-samples: ${GENERATION_PROGRESS_HIGH_CONFIDENCE_SAMPLES:30}
    max-stage-profiles: ${GENERATION_PROGRESS_MAX_STAGE_PROFILES:100}
    max-cached-routes: ${GENERATION_PROGRESS_MAX_CACHED_ROUTES:100}
    profile-cache-ttl: ${GENERATION_PROGRESS_PROFILE_CACHE_TTL:1m}
    fallback-total-duration: ${GENERATION_PROGRESS_FALLBACK_TOTAL_DURATION:20m}
    maximum-estimated-duration: ${GENERATION_PROGRESS_MAXIMUM_ESTIMATED_DURATION:2h}
    minimum-running-remaining: ${GENERATION_PROGRESS_MINIMUM_RUNNING_REMAINING:5s}
    fallback-p90-multiplier: ${GENERATION_PROGRESS_FALLBACK_P90_MULTIPLIER:1.5}
    running-progress-cap: ${GENERATION_PROGRESS_RUNNING_CAP:95}
  generation-benchmark:
    task-timeout: ${GENERATION_BENCHMARK_TASK_TIMEOUT:12m}
    cancellation-grace-timeout: ${GENERATION_BENCHMARK_CANCELLATION_GRACE_TIMEOUT:30s}
    terminal-poll-interval: ${GENERATION_BENCHMARK_TERMINAL_POLL_INTERVAL:100ms}
    first-preview-observation-timeout: ${GENERATION_BENCHMARK_FIRST_PREVIEW_OBSERVATION_TIMEOUT:2s}
    worker:
      enabled: ${GENERATION_BENCHMARK_WORKER_ENABLED:false}
      output-file: ${GENERATION_BENCHMARK_WORKER_OUTPUT_FILE:}
      evidence-validity: ${GENERATION_BENCHMARK_WORKER_EVIDENCE_VALIDITY:1d}
      candidate:
        subject-type: ${GENERATION_BENCHMARK_WORKER_CANDIDATE_TYPE:}
        model-id: ${GENERATION_BENCHMARK_WORKER_MODEL_ID:0}
        prompt-key: ${GENERATION_BENCHMARK_WORKER_PROMPT_KEY:}
        stable-version: ${GENERATION_BENCHMARK_WORKER_STABLE_VERSION:}
        canary-version: ${GENERATION_BENCHMARK_WORKER_CANARY_VERSION:}
        canary-percentage: ${GENERATION_BENCHMARK_WORKER_CANARY_PERCENTAGE:0}
    browser-grading:
      enabled: ${GENERATION_BENCHMARK_BROWSER_GRADING_ENABLED:false}
